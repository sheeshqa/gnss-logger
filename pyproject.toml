[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-logger"
version = "0.4.0.dev2"
description = "Read-only u-blox GNSS diagnostics and Stage 2 recording contracts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial==3.5"]

[project.scripts]
gnss-logger = "gnss_logger.cli:main"

[tool.setuptools.packages.find]
include = ["gnss_logger*"]

[tool.setuptools]
include-package-data = false
