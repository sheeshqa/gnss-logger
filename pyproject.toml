[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-logger"
version = "0.5.0.dev2"
description = "Read-only u-blox GNSS recording and standalone UBX to RINEX conversion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial==3.5", "tomli>=2; python_version < '3.11'"]

[project.scripts]
gnss-logger = "gnss_logger.cli:main"

[tool.setuptools.packages.find]
include = ["gnss_logger*"]

[tool.setuptools]
include-package-data = false
